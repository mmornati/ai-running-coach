name: graft.yaml

# Valide la politique Graft (`graft.yaml`, https://github.com/mmornati/graft) avec le
# vérificateur officiel `graft policy check`, à chaque PR qui touche le fichier ou ce
# workflow. Le fichier est seulement analysé, jamais exécuté. `pull_request`, jamais
# `pull_request_target` : aucun secret, aucune écriture.
#
# L'outil est épinglé sur un commit précis de Graft (GRAFT_REF, SHA complet, jamais une
# branche) : pour le mettre à jour, remplacer le SHA et vérifier que la PR passe.
on:
  pull_request:
    paths:
      - "graft.yaml"
      - ".github/workflows/graft-yaml.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graft-yaml-${{ github.ref }}
  cancel-in-progress: true

env:
  GRAFT_REF: 9c1a887185f3e7853d2498d66c07559e2f7ec7e5

jobs:
  lint:
    name: graft.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Récupérer Graft (commit épinglé)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mmornati/graft
          ref: ${{ env.GRAFT_REF }}
          path: .graft-tool
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .graft-tool/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .graft-tool/.nvmrc
          cache: pnpm
          cache-dependency-path: .graft-tool/pnpm-lock.yaml

      # `--ignore-scripts` : aucun script d'installation des dépendances de Graft ne
      # s'exécute ; le vérificateur n'en a pas besoin (`tsx` lit les sources).
      - name: Installer Graft
        run: pnpm install --frozen-lockfile --ignore-scripts --dir .graft-tool

      - name: Vérifier graft.yaml
        run: pnpm --dir .graft-tool graft policy check "$GITHUB_WORKSPACE/graft.yaml"
