# Choix de chaussures (#302) : bilan de la paire remplacée `yes_with_change` + `wider_toe_box` → le coach
# propose le modèle LE PLUS PROCHE QUI CORRIGE CE POINT (avant-pied plus large), pas une simple reconduction
# à l'identique, et nomme le point à corriger.
#
# `must_match` : la largeur d'avant-pied est le critère annoncé ; une comparaison avec la paire actuelle.
# `must_not_match` : prix / achat, `/coach-setup`, recommandation annoncée comme écrite.
id = "shoe-selection-wider-toe-box"
prompt = "/shoes"
fixture = "shoe-selection-wider"

[config.language]
responses = "fr"

[expect]
must_match = [
  "(avant-pied|toe[ -]?box|largeur)[^\\n]{0,80}(large|plus de place|[ée]larg)|(large|[ée]larg)[^\\n]{0,80}(avant-pied|toe[ -]?box)",
  "(compar|ultra glide|ancienne|actuelle|paire pr[ée]c[ée]dente)",
]
must_not_match = [
  "coach-setup",
  "(€|\\$|euros?)\\s*\\d|\\d+\\s?(€|\\$|euros?)\\b",
  "(achet(e|ez|er)\\s+(la|le|les)|lien d['’]achat|code promo)",
  "(j['’]ai|je viens d['’]|je viens de)\\s+(enregistr|[ée]crit|cr[ée]{1,2}|termin)[^\\n]{0,40}(recommandation|shoe_recommendation)",
]
files_absent = ["gear/*_shoe_recommendation_*.md"]
