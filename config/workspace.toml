# Configuration de l'espace de travail ai-running-coach
#
# Ce fichier est VERSIONNÉ : il contient les valeurs par défaut partagées.
# Pour des overrides personnels, créez `config/workspace.user.toml`
# (gitignoré) avec la même structure — ses valeurs priment.

[language]
# Langue des fichiers Markdown persistés par les agents/skills
# (activities/, medical/, nutrition/, planning/, rapports/).
# Valeurs : code ISO 639-1 (ex. "fr", "en", "nl").
documents = "fr"

# Langue des réponses à l'utilisateur.
# "auto" = même langue que la requête de l'utilisateur.
responses = "auto"

[notifications]
# Notification push envoyée après chaque synchronisation automatique
# (scripts/daily-sync.sh → scripts/notify.sh). Configurez-la avec
# `scripts/setup-ntfy.sh` (écrit les overrides dans workspace.user.toml).
# Valeurs : "ntfy" (appli gratuite iOS/Android, serveur public ou auto-hébergé) | "none".
provider = "none"
# Serveur ntfy : public (https://ntfy.sh) ou auto-hébergé.
ntfy_url = "https://ntfy.sh"
# Sujet (topic) auquel votre téléphone est abonné — choisissez-le difficile à deviner.
ntfy_topic = ""
# Fichier contenant un token d'accès (serveur avec authentification) — optionnel.
# Jamais versionné : à placer hors du dépôt, ex. "~/.config/ai-running-coach/ntfy.token".
ntfy_token_file = ""

# Alerte d'expiration des tokens Garmin (#32) : `scripts/daily-sync.sh` interroge
# `coach_doctor.py --check garmin_token` avant chaque synchronisation. Sans effet
# si `provider = "none"`.
token_alerts = true
# Seuils, en jours restants avant l'échéance estimée, qui déclenchent une alerte.
# Entiers positifs uniquement (toute valeur non entière est ignorée avec un
# avertissement, jamais évaluée). Le seuil le plus proche de l'échéance (le plus
# petit, ainsi que « expiré ») alerte au maximum une fois par jour jusqu'au
# renouvellement ; un seuil plus lointain (ex. J-14) n'alerte qu'une seule fois
# tant que l'échéance n'a pas atteint le seuil suivant. Une liste vide (`[]`, ou
# ne contenant plus aucun entier valide après filtrage) désactive l'alerte
# d'expiration — sans effet sur la notification 401 explicite, elle toujours active.
token_alert_days = [14, 3]

[sync]
# Synchronisation Garmin automatique (voir docs/mobile.md et scripts/daily-sync.sh).
# Exécuteur headless : "claude" (Claude Code, `claude -p`) | "codex" (Codex CLI, `codex exec`).
runner = "claude"
# Heures locales de lancement (cron/launchd) — installées par `./install.sh --daily-sync`.
# Défaut : après la nuit (sommeil/HRV synchronisés) et après la sortie du midi.
times = ["07:15", "14:15"]
# Nombre de jours à vérifier (aujourd'hui inclus) — seuls les fichiers MD manquants sont récupérés.
lookback_days = 2
# Après chaque run, `git add -A && git commit && git push` dans le workspace s'il est
# un dépôt git (données de la sync + fichiers créés par les sessions mobiles).
# À activer dans workspace.user.toml quand le workspace est votre dépôt privé
# (voir docs/workspace.md). Le push exige un remote accessible sans mot de passe (clé SSH).
git_autocommit = false

[athlete]
# Profil de l'athlète : fichier Markdown libre, dans votre workspace, jamais
# versionné dans le dépôt public. Créé par `/coach-setup` depuis
# `templates/Runner_Profile.template.md`.
profile = "planning/Runner_Profile.md"
# Unités des distances, allures et poids. Valeurs : "metric" | "imperial".
units = "metric"
# Méthode de calcul des zones FC (#43, temps en zone + polarisation 80/20).
#   "auto"        — précédence par défaut : FC au seuil (LTHR) si connue au profil,
#                   sinon Karvonen (FC max/repos), sinon %FCmax (FC max seule)
#   "lthr"        — force la FC au seuil (rien si absente du profil)
#   "karvonen"    — force la réserve FC (rien si FC max ou repos absente)
#   "percent_max" — force le %FCmax (rien si FC max absente)
# Une valeur autre que "auto" force cette méthode SANS repli si le champ requis manque.
hr_zones = "auto"

[sport]
# Discipline principale — détermine le profil chargé depuis `config/sports/`.
# Valeurs : "trail" | "road".
primary = "trail"
# Sports croisés pratiqués, pour la planification hebdomadaire.
# Ex. ["cycling", "swimming", "strength"].
disciplines = []

[agents]
# Agents installés et joignables. Retirez-en pour alléger votre staff : le coach
# ne délègue qu'aux agents listés ici, et `./install.sh` n'installe que ceux-là.
# `./install.sh --no-medical` ou `--agents coach,nutritionist` écrit cette clé.
enabled = ["coach", "medical", "nutritionist", "course-strategist"]

[coaching]
# Comment le coach vous parle. Voir `config/coaching-styles.md` pour ce que
# chaque valeur implique concrètement.
# Valeurs : "bienveillant" | "exigeant" | "factuel" | "pedagogue".
style = "bienveillant"
# Avec quelle force le style s'applique. Valeurs : "gentle" | "balanced" | "strong".
intensity = "balanced"
# Longueur des retours et des rapports. Valeurs : "brief" | "standard" | "detailed".
verbosity = "standard"

[health]
# Bilan matinal avant toute décision de séance.
#   "full"    — le triptyque HRV + FC de repos + readiness (défaut, recommandé)
#   "minimal" — readiness seule, sans analyse HRV/FC de repos
#   "off"     — aucun filtrage santé : le coach planifie sur la charge
#               d'entraînement et votre ressenti déclaré
# Passer à "minimal" ou "off" si votre montre ne mesure pas la HRV, ou si vous
# ne souhaitez pas que l'entraînement soit conditionné à ces données.
morning_check = "full"
# Seuil (°C) au-delà duquel une séance outdoor compte comme « chaude » dans le KPI
# d'acclimatation à la chaleur (#38, `temp_max_c` du jour ≥ ce seuil, borne incluse).
# Indépendant de `morning_check` (jointure activité/météo, pas du bilan matinal).
heat_threshold_c = 25.0

[metrics]
# VAM sur les montées détectées (#46) : gain d'altitude minimal (m) et pente
# moyenne minimale (points de pourcentage, ex. 5 = 5 %) pour qu'une montée soit
# détectée — les DEUX critères doivent être atteints. Défauts : 50 m et 5 %.
# À adapter au terrain habituel (relever `climb_min_gain_m` en plaine
# vallonnée pour ignorer les faux plats, l'abaisser en montagne pour capter de
# courts raidillons).
climb_min_gain_m = 50.0
climb_min_grade_pct = 5.0

[guardrails]
# Moteur de garde-fous déterministe (#52, `scripts/arc_guardrails.py`) : un
# second avis calculé, consulté par le coach avant d'écrire une semaine et
# avant de la pousser au calendrier Garmin (câblage : #53). Défauts documentés
# ici ; voir `scripts/arc_guardrails.py::ASSUMPTIONS` pour la méthode complète
# et les sources de chaque règle.
enabled = true
# R1 : ACWR (charge aiguë/chronique) PROJETÉ en fin de semaine proposée
# au-delà de ce seuil — même repère indicatif que `[health]` ci-dessus, pas un
# seuil de blessure prouvé (Gabbett 2016).
r1_acwr_max = 1.3
# R2 : hausse de la durée hebdomadaire planifiée (+ distance en `[sport].primary
# = "road"`) au-delà de ce pourcentage vs la référence choisie ci-dessous.
r2_volume_increase_max_pct = 10.0
# Référence de comparaison pour R2/R3 : "previous_week" (semaine précédente) ou
# "mean4" (moyenne des 4 semaines précédentes).
r2_volume_reference = "previous_week"
# R3 : hausse du D+ hebdomadaire planifié au-delà de ce pourcentage
# ([sport].primary = "trail" seulement — le D+ n'a pas de sens sur route).
r3_elevation_increase_max_pct = 10.0
# R4 : monotonie de Foster PROJETÉE sur la semaine proposée au-delà de ce seuil.
r4_monotony_max = 2.0
# R6 : part de la plus longue sortie planifiée dans le volume hebdomadaire
# planifié total (famille course à pied), au-delà de ce pourcentage.
r6_long_run_share_max_pct = 35.0
# Sévérité par règle : "info" | "warn" | "block". R1 (ACWR) et R5 (qualité
# après un verdict santé rouge) bloquent par défaut ; les autres avertissent.
severity_r1_acwr_projected = "block"
severity_r2_weekly_volume_jump = "warn"
severity_r3_weekly_elevation_jump = "warn"
severity_r4_monotony_projected = "warn"
severity_r5_quality_after_red = "block"
severity_r6_long_run_share = "warn"
severity_r7_consecutive_quality = "warn"

[dashboard]
# Tableau de bord local (`scripts/dashboard.sh`) : lecture seule, n'écoute que sur
# 127.0.0.1 — l'adresse n'est volontairement pas configurable. Si le port est pris,
# les 9 suivants sont essayés.
port = 8765
