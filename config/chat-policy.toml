# Politique de permissions du chat coach (scripts/arc_chat_policy.py, deploy/chat/SPEC.md).
#
# Appliquée par le service, quel que soit le backend (claude, opencode, mock) :
# chaque appel d'outil, ramené à un nom canonique, reçoit « allow », « ask »
# (approbation explicite de l'athlète) ou « deny ». Ce fichier est versionné :
# il ne contient aucun secret. Ce qui n'est pas listé ici est refusé.

[fs]
# Écriture autorisée uniquement sous ces dossiers du workspace (jamais `.arc/chat/`).
write_dirs = ["activities", "medical", "nutrition", "planning", "rapports", "gear"]
# Chemins jamais lisibles ni modifiables par le modèle (nom de fichier ou dossier, joker `*`).
# Comparaison insensible à la casse (macOS).
# `config/workspace.user.toml` reste LISIBLE (langue, bilan matinal, agents… : le coach en a
# besoin) mais jamais modifiable (hors des dossiers de données) ; le sujet ntfy qu'il contient
# ne sert à rien sans l'accès en lecture au sujet (boutons rapides seulement avec ntfy_token_file).
secret_patterns = [".env", "*.env", "*.token", ".garminconnect", "llm.env", "*.pem", "*.key"]
# Recherche de CONTENU (grep, `pattern`) : uniquement dans ces dossiers (et write_dirs). Une simple
# liste de noms (glob sans `pattern`) reste permise à la racine ; seul le glob est alors contrôlé.
search_dirs = ["resources", "skills", "agents", "templates", "docs"]

[shell]
# Une commande n'est exécutable que si elle commence par l'un de ces préfixes, ne contient
# aucun métacaractère shell (; | & $ ` > < ( ) \ ~ * ? [ ] { } ! retour à la ligne, ni # en début de mot) ET ne
# passe que des options déclarées ci-dessous pour ce script (option inconnue = refus).
allowed_prefixes = [
  "python3 scripts/arc_index.py",
  "python3 scripts/arc_log.py",
  "python3 scripts/arc_race_pacing.py",
  "python3 skills/gpx-analysis/scripts/analyze_gpx.py",
  "python3 skills/course-comparison/scripts/compare_course.py",
  "python3 skills/fit-download/scripts/download_fit.py",
  "python3 scripts/arc_energy.py",
  "python3 scripts/garmin_gear_backfill.py",
  "python3 scripts/arc_guardrails.py",
  "python3 scripts/arc_cycle.py",
  "python3 scripts/arc_nutrition_sync.py",
  "python3 scripts/arc_weight_sync.py",
  "python3 scripts/arc_workout_targets.py",
  "python3 scripts/arc_race_debrief.py",
  "python3 scripts/coach_doctor.py",
  "python3 skills/session-parts-analyzer/scripts/analyze_session_parts.py",
]
# Scripts qui lisent du JSON sur l'entrée standard (le skill `log` : `echo '<json>' | python3
# scripts/arc_log.py`). Seules deux formes sans expansion sont acceptées : chaîne entre
# apostrophes passée par `|`, ou heredoc à délimiteur entre apostrophes (`<< 'EOF'`).
stdin_scripts = ["scripts/arc_log.py", "scripts/arc_nutrition_sync.py", "scripts/arc_weight_sync.py"]

# Options par script (relevées dans l'argparse de chaque script) :
#   flags           options sans valeur ;
#   value_options   options à valeur simple (date, nombre, choix…) ;
#   read_options    options dont la valeur est un chemin LU : dans le workspace, hors secrets et `.arc/` ;
#   output_options  options dont la valeur est un chemin ÉCRIT : sous `[fs].write_dirs` uniquement ;
#   multi_value_options  options argparse `nargs="*"`/`"+"` (déjà listées ci-dessus) : les mots suivants
#                   jusqu'à la prochaine option sont autant de valeurs, chacune contrôlée selon le type de l'option.
# Une valeur qui commence par « - » est toujours refusée. `--workspace` n'est jamais accepté : le service
# tourne déjà dans le workspace.
# Tout argument positionnel ou valeur qui ressemble à un chemin (« / », extension connue) subit
# le même contrôle. `--help` / `-h` sont toujours permis.
[shell.scripts."scripts/arc_index.py"]
flags = ["--memory", "--rebuild", "--with-gps", "--assumptions", "--calibration", "--active", "--json"]
value_options = ["--today", "--activity", "--weeks", "--segment", "--date", "--days", "--since", "--limit", "--trigger", "--outcome", "--months", "--band", "--last-pass", "--activities", "--garmin-gear", "--chat-gear", "--kit", "--sport", "--gear", "--lt-speed-ms"]
# nargs="?" : la valeur est facultative (`--race-plan` seul = plan de course actif).
optional_value_options = ["--race-plan"]
read_options = ["--validate", "--race-plan"]
multi_value_options = ["--validate"]
output_options = ["--db"]

[shell.scripts."scripts/arc_log.py"]
read_options = ["--input"]
output_options = ["--output"]

[shell.scripts."scripts/arc_cycle.py"]
value_options = ["--last-period", "--today"]

# Plan de poussée des apports vers Garmin (#167) : calcul pur, n'écrit rien et n'appelle pas Garmin
# (JSON sur l'entrée standard, ou `--input`). Les ÉCRITURES Garmin (log_food, log_custom_food,
# create_custom_food, add_hydration_data) sont des outils MCP : voir `[mcp].write_tools` — « ask ».
[shell.scripts."scripts/arc_nutrition_sync.py"]
read_options = ["--input"]

# Poids du jour lu dans Garmin (#222) : décision pure, lit les fichiers santé, n'écrit rien et
# n'appelle pas Garmin (réponse de get_daily_weigh_ins/get_weigh_ins passée par `--garmin` ou stdin).
[shell.scripts."scripts/arc_weight_sync.py"]
flags = ["--existing-only"]
value_options = ["--garmin", "--date", "--declared-kg"]
read_options = ["--input"]

[shell.scripts."scripts/arc_race_pacing.py"]
flags = ["--memory", "--rebuild", "--dem", "--no-dem"]
value_options = ["--today", "--band", "--months", "--segment-m", "--race-date", "--start", "--official-distance-m", "--fade-pct", "--fade-weeks", "--temp-max-c", "--pack-kg", "--terrain"]
read_options = ["--gpx", "--aid-stations", "--weather-file"]
output_options = ["--db"]

[shell.scripts."skills/gpx-analysis/scripts/analyze_gpx.py"]
flags = ["--quiet", "--dem", "--no-dem"]
value_options = ["--name", "--target-distance", "--target-dp", "--smooth", "--min-gain", "--min-grade", "--min-climb-dist", "--dem-step"]
read_options = ["--gpx"]
output_options = ["--output", "--json"]

[shell.scripts."skills/course-comparison/scripts/compare_course.py"]
value_options = ["--lieu", "--aliases", "--ref", "--dates", "--exclude-dates", "--loop-length", "--tolerance", "--min-climb"]
multi_value_options = ["--aliases", "--exclude-dates"]
read_options = ["--dir"]
output_options = ["--output", "--json"]

[shell.scripts."skills/fit-download/scripts/download_fit.py"]
flags = ["--json", "--overwrite"]
read_options = ["--from-dir"]
output_options = ["--output-dir"]

[shell.scripts."scripts/arc_guardrails.py"]
flags = ["--memory"]
value_options = ["--week-start", "--today"]
read_options = ["--week"]
output_options = ["--db"]

# `--session` : chemin/Semaine.md#SÉLECTEUR (le JSON en ligne, avec ses accolades, reste refusé).
[shell.scripts."scripts/arc_workout_targets.py"]
flags = ["--memory"]
value_options = ["--structure-text", "--band", "--today", "--lt-speed-ms"]
read_options = ["--session"]
output_options = ["--db"]

[shell.scripts."scripts/arc_race_debrief.py"]
value_options = ["--scenario", "--carbs-target-g-h", "--carbs-actual-g-h", "--carbs-ceiling-g-h"]
read_options = ["--plan", "--activity", "--planned-weather", "--actual-weather", "--fit"]

# Diagnostic : lit les jetons Garmin lui-même, n'en affiche rien. `--tokens-dir` et
# `--workspace` restent refusés (pas de redirection vers d'autres fichiers).
[shell.scripts."scripts/coach_doctor.py"]
flags = ["--json", "--probe-mcp"]
value_options = ["--check", "--now"]

# `--garmin-host` refusé : ne jamais envoyer les jetons Garmin vers un autre hôte.
[shell.scripts."skills/session-parts-analyzer/scripts/analyze_session_parts.py"]
flags = ["--quiet"]
value_options = ["--activity-id", "--part", "--smooth-window", "--stride-threshold", "--recovery-threshold"]
read_options = ["--fit", "--activity-json"]
output_options = ["--output", "--json"]

# Rattrapage du matériel Garmin (#145) : simulation libre ; `--apply` écrit dans activities/
# et le profil → carte d'approbation (ask_flags), comme une écriture Garmin.
[shell.scripts."scripts/garmin_gear_backfill.py"]
flags = ["--all-shoes", "--json"]
value_options = ["--since", "--gear"]
ask_flags = ["--apply"]

[shell.scripts."scripts/arc_energy.py"]

[web]
# Domaines joignables par `web.fetch` (le domaine exact ou un sous-domaine). `web.search` est refusé.
fetch_domains = ["wttr.in", "overpass-api.de", "nominatim.openstreetmap.org"]

[mcp]
# Serveurs MCP connus : lectures autorisées, écritures soumises à approbation.
# Tout autre serveur est refusé.
# « leanproxy » : méta-outils de la passerelle (list_/search_) ; ses appels
# invoke_tool sont ramenés au serveur réel par le backend (mcp:garmin.<outil>).
# « strava » (#164, r-huijts/strava-mcp) nomme ses outils avec des tirets (get-recent-activities…).
servers = ["garmin", "intervals", "Intervals_icu", "strava", "leanproxy"]
# Lectures : préfixes de noms d'outils (les tirets sont ceux du serveur Strava). « icu_get_ » /
# « icu_search_ » / « icu_list_ » : outils du serveur intervals.icu (fork hhopke, #165), tous préfixés
# `icu_`. `icu_download_*` n'y figure PAS : ces outils écrivent un fichier local (paramètre
# `output_path`) → approbation.
read_prefixes = ["get_", "count_", "list_", "download_", "search_", "get-", "list-", "check-", "explore-",
                 "icu_get_", "icu_search_", "icu_list_"]
# Écritures : noms exacts ou motifs `*`. Un outil inconnu d'un serveur connu demande aussi l'approbation.
write_tools = [
  "schedule_workout", "schedule_workouts", "schedule_week",
  "delete_workout", "delete_workouts", "unschedule_workout",
  "upload_workout", "upload_workouts", "upload_course", "delete_course",
  "create_*_workout", "create_custom_food", "update_custom_food",
  "log_food", "log_custom_food", "add_hydration_data",
  "add_*", "set_*", "log_*", "delete_*", "update_*", "remove_*",
  "add_or_update_event", "create_event", "bulk_create_events", "update_event",
  "delete_event", "delete_events*", "request_reload",
  # Strava (#164) : connexion/déconnexion OAuth et écriture (étoile de segment) — jamais en lecture libre.
  "connect-strava", "disconnect-strava", "star-segment",
  # intervals.icu (fork hhopke, #165) : tout outil `icu_*` qui modifie quelque chose.
  "icu_create_*", "icu_update_*", "icu_delete_*", "icu_bulk_*", "icu_add_*", "icu_apply_*",
  "icu_duplicate_*",
]
