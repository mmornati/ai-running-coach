name: Tag a release

# Lancé à la main (onglet Actions → « Tag a release » → Run workflow) : calcule
# la prochaine version SemVer à partir du dernier tag `v*`, pose un tag annoté
# sur le commit de `main` dont les tests ont réussi et le pousse, puis enchaîne
# sur la release, l'image Docker du tableau de bord (publish.yml) et le DMG macOS.
#
# Rien n'est jamais poussé sur `main` : seul le tag part. `main` peut donc exiger
# une pull request et le statut « Tests » (règle de protection), sans exception
# pour GitHub Actions. Le numéro de version vient du tag : `git describe --tags`
# dans un dépôt git (scripts/arc_version.py), et le fichier VERSION écrit au
# moment du build dans l'image Docker (publish.yml) et dans le moteur embarqué du
# DMG (scripts/build-macos-dmg.sh, ARC_APP_VERSION). Le fichier VERSION du dépôt
# n'est plus qu'un repli pour un moteur sans `.git` : il se met à jour par une PR
# ordinaire, et ce workflow signale seulement un écart.
#
# Pourquoi l'appel direct (`uses: ./.github/workflows/release.yml`) plutôt que
# de compter sur le déclencheur `push: tags` : un tag poussé avec le
# GITHUB_TOKEN ne déclenche AUCUN autre workflow (garde-fou anti-boucle de
# GitHub). Sans ces appels, la release, son image et son DMG ne seraient jamais
# créés. Un tag poussé à la main (`git push origin v1.2.3`) déclenche la release
# (release.yml) et l'image (publish.yml) mais PAS le DMG : celui-ci est opt-in
# (champ « build_dmg », ou Application macOS en déclenchement manuel avec le tag).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incrément SemVer depuis le dernier tag (ignoré si « version » est renseigné)"
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Version explicite, ex. v1.0.0 ou v1.1.0-rc.1 (optionnel)"
        type: string
        required: false
      build_dmg:
        description: "Construire aussi le DMG macOS sur GitHub (CircleCI le construit déjà pour chaque tag v*)"
        type: boolean
        default: false

permissions:
  # Les jobs créent le tag (jamais de commit sur main), la release ou son DMG. Un workflow réutilisable ne
  # peut pas élever les droits reçus de son appelant : le job `docker` déclare
  # lui-même `packages: write` pour publish.yml.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Une release se tague toujours depuis main, jamais depuis une branche de travail.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push du tag seulement : aucun commit, aucune branche
      checks: read # statut « Tests » du commit à taguer
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique et tous les tags

      # Jamais de release sur un commit dont les tests n'ont pas réussi. Le commit
      # tagué est exactement celui-ci (github.sha), même si main avance entre-temps.
      - name: Tests verts sur le commit à taguer
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Le passage le plus récent du job « Tests » (relances, lancement hebdomadaire…).
          result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=Tests&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')"
          echo "Tests sur ${SHA:0:7} : ${result:-aucun}"
          if [ "$result" != "completed success" ]; then
            echo "::error::Le job « Tests » n'a pas réussi sur ${SHA:0:7} (${result:-absent}) : release refusée"
            exit 1
          fi

      - name: Calcul de la prochaine version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [ -n "$VERSION" ]; then
            tag="$VERSION"
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            # Dernière version STABLE (les pré-versions -rc… ne servent pas de base).
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "Dernier tag : $last → $tag ($BUMP)"
          fi

          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::« $tag » n'est pas une version SemVer (attendu vX.Y.Z ou vX.Y.Z-suffixe)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Le tag $tag existe déjà"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Repli des moteurs sans .git : un écart ne bloque rien (le tag fait foi),
          # il se corrige par une PR ordinaire.
          file="$(tr -d '[:space:]' 2>/dev/null < VERSION || true)"
          if [ "$file" != "${tag#v}" ]; then
            echo "::notice::VERSION indique « ${file:-vide} », le tag sera $tag : images et DMG reçoivent le numéro du tag ; mettre VERSION à jour par une PR si besoin"
          fi

      # Seul le tag est poussé, sur le commit testé : aucun push vers main, donc
      # compatible avec une règle exigeant une PR et le statut « Tests ».
      - name: Création et push du tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "### Tag \`$TAG\` poussé sur \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  docker:
    # Images Docker de la release (:X.Y.Z, :X.Y, :latest) : publish.yml ne voit pas
    # le tag poussé par le GITHUB_TOKEN, il est donc appelé directement.
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  macos-dmg:
    # Opt-in : CircleCI construit déjà le DMG pour chaque tag v*, le refaire ici serait
    # un doublon. Pour le joindre plus tard : Application macOS → Run workflow, avec le tag.
    if: ${{ inputs.build_dmg }}
    needs: [tag, release]
    uses: ./.github/workflows/macos-dmg.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
