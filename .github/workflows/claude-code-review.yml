name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # Fork PRs get a read-only token, no secrets and no OIDC token on the
    # `pull_request` event, so the action cannot authenticate: skip them
    # instead of failing (maintainers can review them by hand).
    # Les PR Dependabot n'ont pas accès aux secrets : on les saute aussi.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # La revue est facturée sur la clé API du dépôt, quel que soit l'auteur de la PR : chaque push
      # sur une branche du dépôt relance une revue. Les forks et Dependabot sont écartés plus haut.
      # Sans clé, l'action échoue avant toute revue et marque la PR en rouge pour une raison
      # étrangère à son code. On le signale par un avertissement : la revue n'a PAS eu lieu.
      - name: Check review credentials
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Revue Claude non effectuée::Secret ANTHROPIC_API_KEY absent : cette PR n'a pas été relue par Claude."
            echo "**Revue Claude non effectuée** : secret \`ANTHROPIC_API_KEY\` absent." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.credentials.outputs.available == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # L'action masque le texte de l'erreur (`is_error: true` sans explication) : en cas d'échec,
      # on lit seulement le motif dans le dernier enregistrement `result` de son fichier d'exécution,
      # jamais le prompt ni la sortie des outils. Ce texte n'est pas fiable : il sort sur une ligne,
      # tronqué, derrière un `stop-commands` à jeton aléatoire. `-I` empêche un fichier de la PR de
      # remplacer un module. L'étape précédente reste en échec : le job reste rouge.
      - name: Show Claude failure reason
        if: failure() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          python3 -I - <<'PY'
          import json, os, secrets

          LIMIT = 500


          def field(record, key):
              if key not in record:
                  return "(absent)"
              value = record[key]
              if isinstance(value, str):
                  return json.dumps(value[:LIMIT])
              return json.dumps(value)[:LIMIT]


          lines = []
          try:
              with open(os.environ["EXECUTION_FILE"], encoding="utf-8") as handle:
                  messages = json.load(handle)
              if not isinstance(messages, list):
                  messages = []
              records = [m for m in messages if isinstance(m, dict) and m.get("type") == "result"]
              if records:
                  for key in ("result", "api_error_status", "terminal_reason"):
                      lines.append(f"{key}: {field(records[-1], key)}")
              else:
                  lines.append("Aucun enregistrement result dans le fichier d'exécution.")
          except Exception as error:
              lines.append(f"Fichier d'exécution illisible ({type(error).__name__}).")

          token = secrets.token_hex(16)
          print(f"::stop-commands::{token}")
          print("\n".join(lines))
          print(f"::{token}::")
          PY

