name: Tests

# Paliers A (intégration de l'installation) et B (lint des prompts et de la
# configuration) : déterministes, gratuits, à chaque poussée.
# Le palier C (évals d'exécution) coûte des jetons — voir evals.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Filet de sécurité hebdomadaire : macOS complet, même si aucun fichier sensible
  # n'a bougé depuis la semaine précédente (coût maîtrisé, voir `changes`).
  schedule:
    - cron: "37 4 * * 0"

# Ces jobs ne font que lire le dépôt et lancer des tests locaux : aucun n'a besoin
# d'écrire quoi que ce soit sur GitHub (#29 — moindre privilège explicite partout).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Décide QUOI lancer, en quelques secondes, avant de réserver le moindre runner
    # macOS. Sur une PR, macOS ne tourne que si elle touche ce qui dépend vraiment
    # de l'OS (bash 3.2, sed BSD, launchctl, gestion de processus) : tout le reste du
    # code est du Python stdlib, déjà couvert sur Ubuntu. Sur une poussée vers
    # `main`, même règle appliquée aux fichiers de la poussée. macOS tourne toujours
    # en déclenchement manuel et chaque dimanche (`schedule`), qui rattrapent ce que
    # le filtrage a laissé passer. Le dépôt est public : les runners macOS standard
    # y sont gratuits (seule limite : 5 jobs macOS simultanés). Pour couper macOS sur
    # GitHub, poser la variable de dépôt ARC_MACOS_ON_GITHUB à « false ».
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MACOS_ON_GITHUB: ${{ vars.ARC_MACOS_ON_GITHUB }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # Chemins sensibles à l'OS. En cas de doute, ajouter ici plutôt qu'ailleurs :
          # un macOS de trop coûte quelques minutes, un macOS manquant un bug en prod.
          MACOS_PATHS: >-
            ^install\.sh$|\.sh$|^scripts/lib/|^tests/lib/|^macos/|^config/workspace\.toml$|^scripts/(coach_doctor|coach_config|coach_setup|garmin_watch|watch|arc_telegram|arc_chat[a-z_]*)\.py$|^tests/install/test_(install|agent_selection|daily_sync|coach_|scripts|token_expiry|config_parser|cycle_tracking|nutrition_sync|llm_chat_ops|telegram_ops|chat_)|^tests/data/test_arc_chat|^tests/run_tests\.py$|^\.github/workflows/tests\.yml$
        run: |
          set -euo pipefail
          macos=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            if printf '%s\n' "$files" | grep -Eq "$MACOS_PATHS"; then
              printf '%s\n' "$files" | grep -E "$MACOS_PATHS" | sed 's/^/macOS requis par : /'
            else
              macos=false
              echo "Aucun fichier sensible à l'OS : macOS ignoré (Ubuntu couvre tout)."
            fi
          elif [ "$EVENT" = push ]; then
            # Poussée sur main : seuls les fichiers de la poussée comptent. Sans
            # comparaison exploitable (première poussée d'une branche, « before » nul,
            # API en échec), macOS tourne par prudence.
            if files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null); then
              if printf '%s\n' "$files" | grep -Eq "$MACOS_PATHS"; then
                printf '%s\n' "$files" | grep -E "$MACOS_PATHS" | sed 's/^/macOS requis par : /'
              else
                macos=false
                echo "Poussée sans fichier sensible à l'OS : macOS ignoré (Ubuntu couvre tout)."
              fi
            else
              echo "Comparaison de la poussée indisponible : macOS lancé par prudence."
            fi
          fi
          # Interrupteur : macOS tourne sur GitHub par défaut ; la variable de dépôt
          # ARC_MACOS_ON_GITHUB = « false » le coupe (dépôt privé, quota épuisé…).
          if [ "${MACOS_ON_GITHUB:-}" = false ]; then
            macos=false
            echo "macOS désactivé sur GitHub (ARC_MACOS_ON_GITHUB = false)."
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          # Paliers découpés en parts (`run_tests.py --shard`, par classe) lancées en
          # parallèle : le palier A seul prenait 6 min sur Ubuntu et 9 min sur macOS.
          MACOS="$macos" python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          rows = [
              {"os": "ubuntu-latest", "tier": "b", "label": "B lint + shellcheck", "shellcheck": True, "dryrun": True},
              *({"os": "ubuntu-latest", "tier": "a", "shard": f"{i}/3", "label": f"A {i}/3"} for i in (1, 2, 3)),
              *({"os": "ubuntu-latest", "tier": "d", "shard": f"{i}/2", "label": f"D {i}/2"} for i in (1, 2)),
          ]
          if os.environ["MACOS"] == "true":
              rows += [
                  *({"os": "macos-latest", "tier": "a", "shard": f"{i}/2", "label": f"A {i}/2"} for i in (1, 2)),
                  {"os": "macos-latest", "tier": "bd", "label": "B + D", "dryrun": True},
              ]
          print("matrix=" + json.dumps({"include": rows}))
          PY

  tests:
    name: ${{ matrix.os }} · ${{ matrix.label }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS n'est pas optionnel quand il est concerné : bash 3.2, le sed de BSD et
      # launchctl sont des cibles de premier plan (voir `changes` pour le filtrage).
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version de bash
        run: bash --version | head -1

      # shellcheck est préinstallé sur les images Ubuntu de GitHub ; sa sortie ne
      # dépend pas de l'OS, inutile de le relancer sur macOS.
      - name: shellcheck
        if: matrix.shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck -S warning install.sh scripts/*.sh scripts/lib/*.sh tests/lib/stubs/*

      - name: Palier(s) ${{ matrix.tier }}${{ matrix.shard && format(' — part {0}', matrix.shard) || '' }}
        run: python3 tests/run_tests.py --tier "${{ matrix.tier }}" ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

      - name: Aperçu --dry-run (aucune écriture attendue)
        if: matrix.dryrun
        run: ./install.sh --dry-run --no-auth

  result:
    # Un seul statut stable (« Tests ») à exiger dans une règle de protection de
    # branche, quel que soit le découpage de la matrice ou la présence de macOS. Il
    # couvre TOUS les jobs : publish.yml (:edge) et tag.yml (release) ne regardent
    # que lui. L'application macOS ignorée (aucun fichier sensible à l'OS) compte
    # comme un succès.
    name: Tests
    if: always()
    needs: [changes, tests, docker, docs, macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Bilan
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          DOCKER: ${{ needs.docker.result }}
          DOCS: ${{ needs.docs.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          MACOS: ${{ needs.changes.outputs.macos }}
        run: |
          echo "plan=$CHANGES tests=$TESTS docker=$DOCKER docs=$DOCS macos-app=$MACOS_APP macos=$MACOS"
          [ "$CHANGES" = success ] && [ "$TESTS" = success ] && [ "$DOCKER" = success ] && [ "$DOCS" = success ] \
            && { [ "$MACOS_APP" = success ] || [ "$MACOS_APP" = skipped ]; }

  docker:
    # Le conteneur du tableau de bord : construit, démarré sur un workspace en
    # lecture seule, et interrogé comme le ferait le reverse proxy.
    name: Docker (tableau de bord)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t arc-dashboard:ci .

      - name: Démarrer sur un workspace en lecture seule
        run: |
          docker run -d --name arc-dashboard --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp \
            -e ARC_DASHBOARD_ALLOWED_HOSTS=coach.example.org \
            -v "$PWD/tests/evals/fixtures/base-week:/workspace:ro" \
            -p 127.0.0.1:8765:8765 arc-dashboard:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' arc-dashboard)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' arc-dashboard | grep -qx healthy

      - name: Nom public accepté, hôte étranger refusé, lecture seule
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" -X "${2:-GET}" "http://127.0.0.1:8765${3:-/api/summary}"; }
          test "$(code coach.example.org)" = 200
          test "$(code evil.example.org)" = 403
          test "$(code coach.example.org POST)" = 405
          curl -sf -H 'Host: coach.example.org' http://127.0.0.1:8765/api/summary | grep -q '"today"'
          test "$(docker exec arc-dashboard id -u)" != 0

      - name: Refus de démarrer sans nom public
        run: |
          if docker run --rm -e ARC_DASHBOARD_ALLOWED_HOSTS= \
               -v "$PWD/tests/evals/fixtures/base-week:/workspace:ro" arc-dashboard:ci 2>err.txt; then
            echo "le conteneur a démarré sans nom public autorisé" >&2; exit 1
          fi
          grep -q -- '--allowed-host' err.txt

      - name: Journal du conteneur
        if: failure()
        run: docker logs arc-dashboard || true

      # Le serveur construit lui-même l'image du chat (deploy/chat) : elle doit
      # rester constructible avec ses arguments par défaut.
      - name: Construire l'image du chat
        run: docker build -t arc-chat:ci deploy/chat

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  macos-app:
    name: Application macOS · compilation et flux de mise à jour
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tester les transactions du moteur
        run: python3 -m unittest tests.install.test_engine_update tests.lint.test_macos_updates
      - name: Construire et vérifier deux versions avec une clé éphémère
        run: scripts/test-macos-update.sh
