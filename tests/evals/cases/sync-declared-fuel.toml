# Contrat de données, ravitaillement pendant l'effort (#39) : quand l'athlète
# déclare son ravitaillement dans le même message que la synchronisation, le
# coach doit le reporter sur l'activité concernée — pas juste écrire un bloc
# ```arc valide (déjà couvert par `sync-writes-arc-block`), mais y mettre les
# valeurs déclarées, converties via le catalogue produit fourni en fixture
# (`resources/nutrition/catalogue-produits-fixture.md` : 1 « Gel Fixture Test »
# = 32 g de glucides). 3 gels ⇒ 96 g, une marge de tolérance absorbe
# l'arrondi ; `fluid_intake_ml` doit reprendre les 750 ml déclarés au gramme
# près, aucune conversion n'étant nécessaire dessus.
#
# L'unique activité du stub (`stub_garmin_mcp.CANNED["get_activities"]`) est
# datée d'avant-hier (`_day(2)`) : le prompt la nomme explicitement plutôt que
# de dire « aujourd'hui », sans quoi un agent correct ne trouverait aucune
# séance du jour et n'écrirait rien — faux négatif, pas un signal du contrat.
id = "sync-declared-fuel"
prompt = "Synchronise ma dernière séance (la sortie longue d'avant-hier). Pendant l'effort, j'ai pris 3 Gel Fixture Test et bu 750 ml d'eau."
fixture = "sync-declared-fuel"

[expect]
files_with_arc_block = ["activities/*.md"]

[[expect.arc_field]]
glob = "activities/*.md"
path = "fluid_intake_ml"
equals = 750

[[expect.arc_field]]
glob = "activities/*.md"
path = "carbs_g"
min = 85

[[expect.arc_field]]
glob = "activities/*.md"
path = "carbs_g"
max = 105
