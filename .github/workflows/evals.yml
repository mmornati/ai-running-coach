name: Évals

# Palier C — exécution réelle des prompts avec un modèle léger. Coûte des jetons et
# n'est jamais déterministe : trois déclencheurs, tous pensés pour plafonner le coût
# et ne jamais exposer de secret à du code non fiable (détail complet dans la section
# Sécurité de la PR #29) :
#
#   - `schedule` HEBDOMADAIRE (pas nocturne comme avant #29) : le comportement des
#     agents ne dérive pas d'un jour à l'autre, un run par semaine suffit à détecter
#     une régression sans payer un abonnement quotidien de jetons.
#   - `workflow_dispatch`, avec un filtre de cas optionnel (`-k`) en plus du modèle et
#     des répétitions, pour rejouer un sous-ensemble ciblé sans relancer toute la suite.
#   - `pull_request` de type `labeled` **uniquement** (jamais `synchronize`) : poser
#     l'étiquette `run-evals` est l'acte d'approbation d'un mainteneur ; la laisser
#     réagir à chaque push relancerait les évals à chaque commit d'une PR déjà
#     étiquetée, un coût non plafonné. Pour rejouer après un correctif, retirer puis
#     reposer l'étiquette.
#
# Jamais `pull_request_target` : cet événement donnerait les secrets du dépôt à un
# checkout de la branche de la PR, donc à du code potentiellement non fiable (« pwn
# request »). `pull_request` classique ne donne de toute façon aucun secret à une PR
# de fork — la garde same-repo ci-dessous n'est qu'une défense en profondeur, utile
# si le dépôt change un jour ses réglages d'organisation sur le partage de secrets
# avec les forks internes.
#
# ATTENTION (revue PR #74, point 8) : poser l'étiquette `run-evals` lance ce workflow
# TEL QU'IL EXISTE SUR LA BRANCHE DE LA PR, avec le secret `ANTHROPIC_API_KEY` — pas
# la version sur `main`. Une PR qui modifie CE fichier, `tests/run_tests.py`,
# `tests/evals/runner.py` ou `tests/evals/render_results.py` peut donc changer ce que
# l'étiquette exécute et avec quels privilèges. Poser l'étiquette équivaut à approuver
# l'exécution du code de la PR avec ce secret — exactement ce qu'un accès en écriture
# donnerait déjà, mais un mainteneur doit relire tout changement touchant à ces
# fichiers AVANT de poser l'étiquette, pas seulement le reste du diff.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Répétitions par scénario"
        default: "3"
      model:
        description: "Modèle à évaluer"
        default: "claude-haiku-4-5-20251001"
      cases:
        description: "Filtre de cas (-k du runner de tests), vide = tous"
        default: ""
  schedule:
    - cron: "17 3 * * 1" # lundi 03:17 UTC
  pull_request:
    types: [labeled]

jobs:
  evals:
    runs-on: ubuntu-latest
    # Plafond de coût : au-delà, le job échoue plutôt que de consommer indéfiniment.
    # ~15 cas × 3 répétitions × jusqu'à ~60s chacun (installation de l'outil comprise
    # sur le premier) peut approcher 45 min dans le pire cas ; 60 min laisse de la
    # marge sans être un chèque en blanc (revue PR #74, point 7 : 30 min était trop
    # juste et aurait fait échouer des runs par ailleurs sains).
    timeout-minutes: 60
    permissions:
      # Rien de plus que lire le dépôt : ce job n'écrit jamais sur GitHub lui-même,
      # il ne fait que produire des artefacts. `pull-requests: write` reste isolé
      # dans le job `comment`, qui n'exécute lui-même aucun prompt (voir plus bas).
      contents: read
    # Trois conditions, une par déclencheur : schedule/dispatch tournent seulement sur
    # le dépôt canonique (jamais sur un fork qui aurait copié le workflow) ; la PR ne
    # tourne que si l'étiquette QUI VIENT D'ÊTRE POSÉE est bien `run-evals`, sur une PR
    # du dépôt lui-même (jamais d'une fork — appartient déjà par défaut sans secrets,
    # mais on le vérifie explicitement). Verrouillé par
    # `tests/lint/test_workflow_lint.py::TestEvalsWorkflowLabelGuard`, qui isole CE
    # bloc `if:` (pas le fichier entier) pour vérifier les trois gardes.
    if: >
      github.repository == 'mmornati/ai-running-coach' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.label.name == 'run-evals' &&
          contains(github.event.pull_request.labels.*.name, 'run-evals') &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    # Groupe de concurrence PORTÉ PAR LE JOB, pas par le workflow (revue PR #74, point
    # 1 — BLOQUANT dans la revue précédente) : posé au niveau du workflow, N'IMPORTE
    # QUELLE autre étiquette ajoutée à la PR pendant que ce job tourne aurait rejoint
    # le même groupe (le déclencheur `pull_request: types: [labeled]` réagit à
    # N'IMPORTE quelle étiquette, la condition `if:` ci-dessus ne filtrant qu'ENSUITE)
    # et aurait annulé le run payant en cours, alors même que ce nouveau run n'exécute
    # rien. Porté par le job, le groupe n'est rejoint QUE quand `if:` est vrai — un
    # ajout d'étiquette sans rapport, dont le job est `skipped`, n'entre jamais dans
    # le groupe et ne peut donc rien annuler. Seul un second run où `run-evals` est
    # réellement reposée (retrait + repose) partage le groupe et annule le précédent
    # — le comportement voulu.
    concurrency:
      group: evals-${{ github.event_name }}-${{ github.event.pull_request.number || 'scheduled' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Le jeton de checkout n'a besoin d'exister que le temps du clone : aucune
          # étape suivante ne pousse quoi que ce soit avec (nit, revue PR #74, point 9).
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Lancer les évals
        env:
          ARC_LLM_TESTS: "1"
          ARC_EVAL_REPEAT: ${{ inputs.repeat || '3' }}
          ARC_EVAL_MODEL: ${{ inputs.model || 'claude-haiku-4-5-20251001' }}
          # Consommé par `render_results.py` juste après (#29) — chaque cas y ajoute
          # son taux de réussite au fil de l'eau (voir `runner.record_result`).
          ARC_EVAL_RESULTS_OUT: /tmp/eval-results.json
          ARC_EVAL_CASE_FILTER: ${{ inputs.cases || '' }}
          # Absente (fork sans secret configuré, ou avant que le mainteneur ne l'ait
          # réglé après le merge de la #29) : chaque cas se retrouve juste `skipped`,
          # jamais en échec — voir `runner.looks_unauthenticated`.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if [ -n "$ARC_EVAL_CASE_FILTER" ]; then
            python3 tests/run_tests.py --tier c -k "$ARC_EVAL_CASE_FILTER" | tee /tmp/evals.log
          else
            python3 tests/run_tests.py --tier c | tee /tmp/evals.log
          fi

      - name: Publier le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-log
          path: /tmp/evals.log

      - name: Rendre RESULTS.md
        if: always()
        env:
          ARC_EVAL_MODEL: ${{ inputs.model || 'claude-haiku-4-5-20251001' }}
          ARC_EVAL_REPEAT: ${{ inputs.repeat || '3' }}
        run: |
          python3 tests/evals/render_results.py \
            --results /tmp/eval-results.json \
            --previous tests/evals/RESULTS.md \
            --model "$ARC_EVAL_MODEL" \
            --repeat "$ARC_EVAL_REPEAT" \
            --out /tmp/RESULTS.md

      - name: Publier RESULTS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: |
            /tmp/RESULTS.md
            /tmp/eval-results.json

  comment:
    # Job séparé et le SEUL avec `pull-requests: write` (#29) : il n'exécute aucun
    # prompt, aucun outil MCP, aucun code de PR — il télécharge un artefact déjà
    # produit par `evals` et en republie le contenu tel quel. Le pire abus possible
    # (une régression de `render_results.py`) resterait borné à un commentaire mal
    # formaté, jamais à une fuite de secret ou une action sur le dépôt.
    needs: evals
    # `success`/`failure` seulement, jamais `cancelled` (revue PR #74, point 1) : un
    # `evals` annulé (relabel légitime, ou plafond de coût atteint) n'a pas forcément
    # publié l'artefact `evals-results` — télécharger un artefact absent ferait
    # échouer ce job pour rien. `skipped` (dépôt non canonique, étiquette différente)
    # est déjà exclu par construction, mais l'écrire en positif (au lieu de `!=
    # 'skipped'`) documente l'intention plutôt que de l'déduire par soustraction.
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      (needs.evals.result == 'success' || needs.evals.result == 'failure') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Télécharger le relevé
        uses: actions/download-artifact@v4
        with:
          name: evals-results
          path: /tmp/evals-results

      - name: Commenter la PR
        uses: actions/github-script@v7
        with:
          # Le contenu posté vient d'un fichier produit par notre propre script
          # (RESULTS.md), jamais du titre/corps de la PR : rien d'interpolé depuis
          # `github.event.pull_request.*` dans une commande shell ici — tout passe
          # par l'API Octokit avec une chaîne lue en Node, pas par `run:`.
          #
          # Mis à jour en place plutôt que reposté (revue PR #74, point 6) : reposer
          # l'étiquette après un correctif ne doit pas empiler un nouveau commentaire
          # à chaque fois — un marqueur caché identifie le commentaire précédent, mis
          # à jour via `updateComment` s'il existe encore. Un corps trop long (limite
          # GitHub 65536 caractères) est tronqué plutôt que de faire échouer l'appel.
          script: |
            const fs = require("fs");
            const MARKER = "<!-- arc-evals-results -->";
            const MAX_LEN = 65536;
            const path = "/tmp/evals-results/RESULTS.md";

            let body = fs.existsSync(path)
              ? fs.readFileSync(path, "utf8")
              : "_Aucun `RESULTS.md` produit (job `evals` terminé sans artefact — voir son journal)._";
            body = `${MARKER}\n\n${body}`;
            if (body.length > MAX_LEN) {
              const notice = "\n\n… (tronqué — voir l'artefact `evals-results` pour le relevé complet)";
              body = body.slice(0, MAX_LEN - notice.length) + notice;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Le login est vérifié en plus du marqueur (revue PR #74, second passage,
            // point 3) : un humain qui citerait le marqueur en réponse (« comme dit
            // plus haut : <!-- arc-evals-results --> ») ne doit jamais être pris pour
            // le commentaire du bot — `updateComment` sur le commentaire de quelqu'un
            // d'autre échoue en 403, et rien ne garantit qu'un tel commentaire soit le
            // bon de toute façon.
            const existing = comments.find(
              (c) => c.body && c.body.includes(MARKER) && c.user && c.user.login === "github-actions[bot]",
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
