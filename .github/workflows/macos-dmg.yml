name: Application macOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag de la release à laquelle joindre le DMG"
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      ARC_SIGNING_IDENTITY_SECRET: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Préparer la signature Apple
        if: ${{ env.ARC_SIGNING_IDENTITY_SECRET != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/arc-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p temporary "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials ai-running-coach-ci \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "ARC_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "ARC_NOTARY_PROFILE=ai-running-coach-ci" >> "$GITHUB_ENV"
          echo "ARC_SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Configurer les mises à jour des versions publiées
        if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${ARC_SIGNED_RELEASE:-}" != true || -z "$PUBLIC_KEY" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Une release exige la signature Apple et les clés SPARKLE_PUBLIC_KEY / SPARKLE_PRIVATE_KEY."
            exit 1
          fi
          echo "ARC_APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "ARC_SPARKLE_PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "ARC_UPDATE_FEED_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" >> "$GITHUB_ENV"

      - name: Construire le DMG universel
        run: scripts/build-macos-dmg.sh

      - name: Signer le flux de mises à jour
        if: ${{ env.ARC_SIGNED_RELEASE == 'true' && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_DIR="$(scripts/fetch-sparkle.sh)"
          mkdir -p dist/updates
          cp dist/AI-Running-Coach-*.dmg dist/updates/
          printf '%s' "$PRIVATE_KEY" | "$SPARKLE_DIR/bin/generate_appcast" --ed-key-file - \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" dist/updates
          test -s dist/updates/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Running-Coach-macOS
          path: |
            dist/AI-Running-Coach-*.dmg
            dist/updates/appcast.xml
          if-no-files-found: error

      - name: Publier sur la version GitHub
        if: ${{ env.ARC_SIGNED_RELEASE == 'true' && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::La release $TAG n'existe pas après 150 secondes."
              exit 1
            fi
            sleep 5
          done
          gh release upload "$TAG" dist/AI-Running-Coach-*.dmg dist/updates/appcast.xml --clobber
