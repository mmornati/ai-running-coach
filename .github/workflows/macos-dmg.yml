name: Application macOS

# Sans identité Apple (secrets MACOS_*/APPLE_*), le DMG est signé ad hoc,
# publié sous le nom « …-unsigned.dmg » avec son empreinte SHA-256, et la
# release reçoit la marche à suivre pour l'ouvrir malgré Gatekeeper. Dès que
# les secrets existent, le même workflow signe, notarise et publie le DMG normal.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'une release existante à laquelle joindre le DMG (vide = artefact seul)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Tag de la release à laquelle joindre le DMG"
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      ARC_SIGNING_IDENTITY_SECRET: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Préparer la signature Apple
        if: ${{ env.ARC_SIGNING_IDENTITY_SECRET != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/arc-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p temporary "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials ai-running-coach-ci \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "ARC_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "ARC_NOTARY_PROFILE=ai-running-coach-ci" >> "$GITHUB_ENV"
          echo "ARC_SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Construire le DMG universel
        run: scripts/build-macos-dmg.sh

      - name: Nommer le DMG et calculer son empreinte
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/AI-Running-Coach-*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Un seul DMG attendu, trouvé : ${dmgs[*]:-aucun}"; exit 1; }
          dmg="${dmgs[0]}"
          if [ "${ARC_SIGNED_RELEASE:-}" != "true" ]; then
            mv "$dmg" "${dmg%.dmg}-unsigned.dmg"
            dmg="${dmg%.dmg}-unsigned.dmg"
          fi
          name="$(basename "$dmg")"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
          echo "ARC_DMG_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Running-Coach-macOS
          path: |
            dist/AI-Running-Coach-*.dmg
            dist/AI-Running-Coach-*.dmg.sha256
          if-no-files-found: error

      - name: Publier sur la version GitHub
        if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::La release $TAG n'existe pas après 150 secondes."
              exit 1
            fi
            sleep 5
          done
          gh release upload "$TAG" "dist/$ARC_DMG_NAME" "dist/$ARC_DMG_NAME.sha256" --clobber

          # Notes d'ouverture ajoutées une seule fois (marqueur), seulement sans signature Apple.
          if [ "${ARC_SIGNED_RELEASE:-}" != "true" ]; then
            notes="$RUNNER_TEMP/notes.md"
            gh release view "$TAG" --json body -q .body > "$notes"
            if ! grep -q 'arc-macos-unsigned' "$notes"; then
              cat >> "$notes" <<EOF_NOTES

          <!-- arc-macos-unsigned -->
          ## Application macOS

          \`$ARC_DMG_NAME\` : application universelle (Apple Silicon et Intel), macOS 13 ou plus récent.
          Elle n'est **pas signée par Apple** : au premier lancement, macOS la bloque.

          1. Ouvrez le DMG et glissez **AI Running Coach** dans **Applications**.
          2. Lancez-la une fois, fermez l'alerte, puis ouvrez **Réglages Système → Confidentialité et sécurité** et cliquez sur **Ouvrir quand même**.

          Empreinte SHA-256 : \`$ARC_DMG_NAME.sha256\` (\`shasum -a 256 -c $ARC_DMG_NAME.sha256\`).
          EOF_NOTES
              gh release edit "$TAG" --notes-file "$notes"
            fi
          fi
          echo "### DMG \`$ARC_DMG_NAME\` joint à la release $TAG" >> "$GITHUB_STEP_SUMMARY"
