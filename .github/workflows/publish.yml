name: Publish images

# Construit l'image du tableau de bord (Dockerfile à la racine) et la publie sur
# GitHub Container Registry : ghcr.io/mmornati/ai-running-coach-dashboard.
# Pour l'instant rien ne la consomme : deploy/dashboard construit encore
# l'image localement. Elle prépare le passage à « docker compose pull ».
#
# Étiquettes :
#   push sur main           → :edge, :sha-<7>     (tête de main, jamais :latest)
#   release vX.Y.Z           → :X.Y.Z, :X.Y, :sha-<7>, et :latest si c'est la
#                              plus haute release stable (un correctif d'une
#                              ancienne branche ne fait pas reculer :latest)
#   pré-version vX.Y.Z-rc.N  → :X.Y.Z-rc.N, :sha-<7>  (jamais :latest ni :X.Y)
#   lancement manuel         → :branch-<nom>, :sha-<7> (tester une branche avant
#                              fusion : Actions → Publish images → Run workflow)
#
# Trois entrées pour une release, comme release.yml : un tag poussé à la main
# (`push: tags`), ou l'appel depuis tag.yml (un tag poussé par le GITHUB_TOKEN ne
# déclenche AUCUN autre workflow, d'où `workflow_call`).
#
# Chaque image porte org.opencontainers.image.revision = commit construit (pas
# github.sha : appelée depuis tag.yml, c'est le commit de main AVANT le commit
# de VERSION) — c'est elle que lit scripts/update-docker.sh --check.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mmornati/ai-running-coach-dashboard

jobs:
  dashboard:
    # Le dépôt canonique seulement : un fork n'a rien à pousser sous ghcr.io/mmornati.
    if: github.repository == 'mmornati/ai-running-coach'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # Deux fusions rapprochées sur main : seule la dernière compte pour :edge.
      # Une release n'est jamais annulée.
      group: publish-dashboard-${{ inputs.tag || github.ref }}
      cancel-in-progress: ${{ inputs.tag == '' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tous les tags, pour savoir si cette release est la plus haute

      - name: Calcul des étiquettes
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi

          sha="$(git rev-parse HEAD)"
          tags=("$IMAGE:sha-${sha:0:7}")
          if [ -n "$tag" ]; then
            if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::« $tag » n'est pas une version SemVer (attendu vX.Y.Z ou vX.Y.Z-suffixe)"
              exit 1
            fi
            version="${tag#v}"
            tags+=("$IMAGE:$version")
            if [ -z "${BASH_REMATCH[4]}" ]; then
              tags+=("$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
              highest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
              if [ "$highest" = "$tag" ]; then
                tags+=("$IMAGE:latest")
              else
                echo "::notice::$tag n'est pas la plus haute release ($highest) : :latest inchangé"
              fi
            fi
          elif [ "$REF_NAME" = main ]; then
            version="edge"
            tags+=("$IMAGE:edge")
          else
            # Nom de branche → étiquette Docker valide ([a-z0-9._-], 128 caractères au plus).
            slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | cut -c1-100)"
            version="branch-$slug"
            tags+=("$IMAGE:branch-$slug")
          fi

          {
            echo "revision=$sha"
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'Étiquettes : %s\n' "${tags[*]}"

      # arm64 : Raspberry Pi, NAS ARM, Mac Apple Silicon. L'image n'installe que
      # tzdata au-dessus de python:alpine, l'émulation QEMU suffit.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # --pull : dernière image Python de base, avec ses correctifs de sécurité.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ARC_REVISION=${{ steps.meta.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          # Provenance et SBOM attachés : ce qu'il y a dans l'image est vérifiable.
          provenance: true
          sbom: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      - name: Résumé
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          {
            echo "### Image du tableau de bord publiée"
            echo
            echo "Révision \`${REVISION:0:7}\`, empreinte \`$DIGEST\`"
            echo
            while read -r tag; do
              [ -z "$tag" ] || echo "- \`$tag\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
