name: Tag a release

# Lancé à la main (onglet Actions → « Tag a release » → Run workflow) : calcule
# la prochaine version SemVer à partir du dernier tag `v*`, pose un tag annoté
# sur `main` et le pousse, puis enchaîne directement sur release.yml.
#
# Pourquoi l'appel direct (`uses: ./.github/workflows/release.yml`) plutôt que
# de compter sur le déclencheur `push: tags` : un tag poussé avec le
# GITHUB_TOKEN ne déclenche AUCUN autre workflow (garde-fou anti-boucle de
# GitHub). Sans cet appel, la release ne serait jamais créée. Un tag poussé à la
# main (`git push origin v1.2.3`) passe, lui, par le déclencheur de release.yml.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incrément SemVer depuis le dernier tag (ignoré si « version » est renseigné)"
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Version explicite, ex. v1.0.0 ou v1.1.0-rc.1 (optionnel)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Une release se tague toujours depuis main, jamais depuis une branche de travail.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tout l'historique et tous les tags

      - name: Calcul de la prochaine version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [ -n "$VERSION" ]; then
            tag="$VERSION"
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            # Dernière version STABLE (les pré-versions -rc… ne servent pas de base).
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "Dernier tag : $last → $tag ($BUMP)"
          fi

          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::« $tag » n'est pas une version SemVer (attendu vX.Y.Z ou vX.Y.Z-suffixe)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Le tag $tag existe déjà"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Création et push du tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "### Tag \`$TAG\` poussé sur \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
